[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "floret-torch"
version = "0.1.0"
description = "GPU training for floret (fastText + Bloom subword table) vectors in PyTorch"
requires-python = ">=3.9"
dependencies = ["numpy", "mmh3"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kiyarash Fazeli", email = "caci96@gmail.com"}]
keywords = ["floret", "fasttext", "word-vectors", "spacy", "pytorch", "gpu", "embeddings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistics",
]

[project.urls]
Homepage = "https://github.com/Fazel94/floret-torch"
Issues = "https://github.com/Fazel94/floret-torch/issues"

[project.optional-dependencies]
# torch is deliberately not a hard dependency: on Colab and most GPU boxes it
# is already present, and pip would otherwise pull a second multi-GB copy.
bench = ["floret", "pytest"]
weasel = ["spacy>=3.2", "weasel", "datasets", "wikiextractor"]

[project.scripts]
floret-torch = "floret_torch.train:main"

[tool.setuptools]
packages = ["floret_torch"]
